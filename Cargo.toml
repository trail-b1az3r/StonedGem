[workspace]
resolver = "2"
members = ["crates/*"]
# The Servo engine is large and slow to build (see docs/ENGINE-SPIKE.md);
# plain `cargo build`/`cargo test` leave it out. Build it with
# `cargo test -p stonedgem-engine`, and the window (stonedgem-chrome, on the
# engine) with `cargo run -p stonedgem-chrome`.
default-members = [
    "crates/stonedgem-url",
    "crates/stonedgem-poweroynix",
    "crates/stonedgem-vault",
    "crates/stonedgem-profile",
    "crates/stonedgem-blocker",
    "crates/stonedgem-library",
    "crates/stonedgem-extensions",
    "crates/stonedgem-theme",
    "crates/stonedgem-zsharp",
    "crates/stonedgem-zsharp-docs",
    "crates/stonedgem-hypertheme",
    "crates/zsharpend",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/trail-b1az3r/StonedGem"

[workspace.dependencies]
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17"
sha2 = "0.11"
sha3 = "0.10"

# Servo makes debug builds huge and slow: dependencies are built without
# debug info and optimised, so the window stays responsive in debug builds
# while our own crates still compile quickly.
[profile.dev.package."*"]
debug = false
opt-level = 2

# The window's own CPU work (glass refraction, page-frame readback) needs
# optimising even in debug builds to keep up with the pointer.
[profile.dev.package.stonedgem-chrome]
opt-level = 2
