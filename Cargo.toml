[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/trail-b1az3r/StonedGem"

[workspace.dependencies]
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17"
sha2 = "0.11"
sha3 = "0.10"
