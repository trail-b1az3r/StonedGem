[workspace]
resolver = "2"
members = ["crates/*"]
# The Servo engine is large and slow to build (see docs/ENGINE-SPIKE.md);
# plain `cargo build`/`cargo test` leave it out. Build it with
# `cargo test -p stonedgem-engine`, and the window (stonedgem-chrome, on the
# engine) with `cargo run -p stonedgem-chrome`.
default-members = [
    "crates/stonedgem-url",
    "crates/stonedgem-poweroynix",
    "crates/stonedgem-vault",
    "crates/stonedgem-profile",
    "crates/stonedgem-blocker",
    "crates/stonedgem-library",
    "crates/stonedgem-extensions",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/trail-b1az3r/StonedGem"

[workspace.dependencies]
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17"
sha2 = "0.11"
sha3 = "0.10"
