# Neubrutalism: the Iced window's panels (Theme Studio).

[toolbar]
fill = "#ffde59"

[tab]
fill = "#ffffff"

[card]
fill = "#ffffff"
shadow_x = 6
shadow_y = 6

[button]
fill = "#5ce1e6"
text = "#111111"

[field]
fill = "#ffffff"

[popup]
fill = "#ffffff"
shadow_x = 6
shadow_y = 6

[dark.toolbar]
fill = "#27272a"

[dark.tab]
fill = "#18181b"

[dark.card]
fill = "#27272a"

[dark.field]
fill = "#18181b"

[dark.popup]
fill = "#27272a"
