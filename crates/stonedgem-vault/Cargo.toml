[package]
name = "stonedgem-vault"
description = "Saved passwords for StonedGem browsers (AES-256-GCM, owner-only key file), CSV import, and import of passwords and bookmarks from Firefox profiles."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
aes = "0.8"
cbc = "0.1"
des = "0.8"
sha1 = "0.10"
base64 = "0.23"
# 0.38: the version Servo (servo-net) links; two sqlite3 links cannot coexist.
rusqlite = { version = "0.38", features = ["bundled"] }
