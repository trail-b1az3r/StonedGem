[package]
name = "stonedgem-chrome"
description = "StonedGem's browser window (Iced): tabs, address bar and the page view drawn from stonedgem-engine."
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true

[[bin]]
name = "stonedgem-browser"
path = "src/main.rs"

[dependencies]
# CPU rendering (tiny-skia) keeps Iced off the GL context Servo draws with.
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "x11", "wayland", "image-without-codecs", "smol", "thread-pool", "linux-theme-detection"] }
stonedgem-engine = { path = "../stonedgem-engine" }
stonedgem-url = { path = "../stonedgem-url" }
stonedgem-blocker = { path = "../stonedgem-blocker" }
stonedgem-library = { path = "../stonedgem-library" }
stonedgem-profile = { path = "../stonedgem-profile" }
stonedgem-theme = { path = "../stonedgem-theme" }
stonedgem-extensions = { path = "../stonedgem-extensions" }
stonedgem-zsharp = { path = "../stonedgem-zsharp" }
stonedgem-hypertheme = { path = "../stonedgem-hypertheme" }
zsharpend = { path = "../zsharpend" }
# Extension panels (`panel.slint`): interpreted, drawn by Slint's software renderer
# into a buffer the window shows.
slint-interpreter = { version = "=1.17.0", default-features = false, features = ["std", "compat-1-2", "renderer-software"] }
i-slint-core = { version = "=1.17.0", default-features = false, features = ["std"] }
i-slint-renderer-software = "=1.17.0"
serde = { workspace = true }
serde_json = { workspace = true }
# Downloads: the same client and certificate handling as OyNIx's updater.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
