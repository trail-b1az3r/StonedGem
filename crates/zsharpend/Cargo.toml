# Vendored from https://github.com/trail-b1az3r/z-nd (crates/zsharpend) at
# 8442032c1d9f8203af71b997ba3c5cbc34369e82, so StonedGem (and OyNIx, which
# depends on StonedGem) build without access to that repository. Change the
# language in z-nd and copy it here; the `zspp` tool stays there.
[package]
name = "zsharpend"
description = "Zsharpend: the next Z#++ — .zxx programs (and Z#++ files), modules, script extenders, nd arrays and 3D, sandboxed and embeddable (StonedGem)."
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/trail-b1az3r/z-nd"

[dependencies]
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
naga = { version = "27", features = ["wgsl-in"] }
