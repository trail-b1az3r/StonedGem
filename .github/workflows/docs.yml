name: Z#++ docs

# Builds the Z#++ documentation site (running every example in it).
# Publishing to GitHub Pages is opt-in: enable Pages with "GitHub Actions"
# as the source and set the repository variable ZSHARP_DOCS_PAGES=true.
on:
  push:
    branches: [main]
    paths: ["docs/zsharp/**", "crates/stonedgem-zsharp/**", "crates/stonedgem-zsharp-docs/**", "examples/zsharp/**"]
  pull_request:
    paths: ["docs/zsharp/**", "crates/stonedgem-zsharp/**", "crates/stonedgem-zsharp-docs/**", "examples/zsharp/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the site
        run: cargo run -p stonedgem-zsharp-docs -- site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.ZSHARP_DOCS_PAGES == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
