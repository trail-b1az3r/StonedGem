name: Build and deploy StonedGem Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "docs/**"
      - "crates/stonedgem-zsharp/**"
      - "crates/stonedgem-zsharp-docs/**"
      - "examples/zsharp/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "index.html"
      - "docs/**"
      - "crates/stonedgem-zsharp/**"
      - "crates/stonedgem-zsharp-docs/**"
      - "examples/zsharp/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the Z#++ documentation site (validate examples)
        run: cargo run -p stonedgem-zsharp-docs -- site/zsharp
      - name: Assemble Pages site
        run: |
          mkdir -p site
          cp index.html site/index.html
          # Preserve the source documentation URLs (including the legacy ZSHARP.md link).
          mkdir -p site/docs
          cp docs/*.md site/docs/
          # Add an HTML redirect for the old docs landing page.
          cat > site/docs/ZSHARP.html <<'EOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../zsharp/index.html"><link rel="canonical" href="../zsharp/index.html"><title>Z#++ documentation</title></head><body><p>Moved: <a href="../zsharp/index.html">Z#++ documentation</a></p></body></html>
          EOF
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
